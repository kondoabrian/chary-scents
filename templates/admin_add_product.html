{% extends "base.html" %}

{% block title %}
Add Product | Charry Scents
{% endblock %}


{% block content %}

<section class="page-header">

    <div class="container">

        <p>
            CHARRY SCENTS ADMIN
        </p>

        <h1>
            Add New Product
        </h1>

        <span>
            Add a new product and choose its image.
        </span>

    </div>

</section>


<section class="section">

    <div class="container">

        <div class="contact-form">

            {% if error %}

                <div class="alert alert-danger">
                    {{ error }}
                </div>

            {% endif %}


            <form
                method="POST"
                action="{{ url_for('admin_add_product') }}"
                enctype="multipart/form-data"
            >


                <!-- PRODUCT NAME -->

                <div class="mb-3">

                    <label class="form-label">
                        Product Name
                    </label>

                    <input
                        type="text"
                        name="name"
                        class="form-control"
                        placeholder="Example: Rose Perfume"
                        required
                    >

                </div>


                <!-- CATEGORY -->

                <div class="mb-3">

                    <label class="form-label">
                        Category
                    </label>

                    <select
                        name="category"
                        class="form-control"
                        required
                    >

                        <option value="">
                            Select Category
                        </option>

                        <option value="Perfumes">
                            Perfumes
                        </option>

                        <option value="Perfume Oils">
                            Perfume Oils
                        </option>

                        <option value="Lip Gloss">
                            Lip Gloss
                        </option>

                        <option value="Lipsticks">
                            Lipsticks
                        </option>

                        <option value="Makeup">
                            Makeup
                        </option>

                        <option value="Skincare">
                            Skincare
                        </option>

                        <option value="Gift Sets">
                            Gift Sets
                        </option>

                        <option value="Accessories">
                            Accessories
                        </option>

                    </select>

                </div>


                <!-- PRICE -->

                <div class="mb-3">

                    <label class="form-label">
                        Price (UGX)
                    </label>

                    <input
                        type="number"
                        name="price"
                        class="form-control"
                        placeholder="Example: 35000"
                        min="0"
                        step="1"
                        required
                    >

                </div>


                <!-- DESCRIPTION -->

                <div class="mb-3">

                    <label class="form-label">
                        Product Description
                    </label>

                    <textarea
                        name="description"
                        class="form-control"
                        rows="5"
                        placeholder="Describe the product..."
                        required
                    ></textarea>

                </div>


                <!-- PRODUCT IMAGE -->

                <div class="mb-4">

                    <label class="form-label">
                        Product Image
                    </label>

                    <input
                        type="file"
                        name="image"
                        class="form-control"
                        accept=".jpg,.jpeg,.png,.webp,image/jpeg,image/png,image/webp"
                        required
                    >

                    <small class="text-muted">
                        Choose a JPG, JPEG, PNG or WEBP image.
                    </small>

                </div>


                <!-- BUTTONS -->

                <div class="d-flex gap-2 flex-wrap">

                    <button
                        type="submit"
                        class="btn btn-main"
                    >
                        <i class="bi bi-plus-circle"></i>
                        Add Product
                    </button>


                    <a
                        href="{{ url_for('admin_products') }}"
                        class="btn btn-outline-secondary"
                    >
                        Cancel
                    </a>

                </div>


            </form>

        </div>

    </div>

</section>

{% endblock %}
